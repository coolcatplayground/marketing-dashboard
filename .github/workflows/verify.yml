name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The demo store's feeds agree with each other
        run: node --test
